version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: hmcs-postgres
    environment:
      POSTGRES_USER: hmcs
      POSTGRES_PASSWORD: hmcs_dev_password
      POSTGRES_DB: hmcs
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmcs -d hmcs"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hmcs-network

  # Client (React)
  client:
    build:
      context: .
      dockerfile: DOCKERFILE.client
    container_name: hmcs-client
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - hmcs-network
    environment:
      - VITE_API_URL=http://localhost:4000

  # Server (Express) — Reference only
  # Uncomment when backend is implemented
  # server:
  #   build:
  #     context: .
  #     dockerfile: DOCKERFILE.server
  #   container_name: hmcs-server
  #   ports:
  #     - "4000:4000"
  #   environment:
  #     DATABASE_URL: postgresql://hmcs:hmcs_dev_password@postgres:5432/hmcs
  #     JWT_SECRET: dev_jwt_secret_change_in_production_min_32_chars
  #     JWT_ACCESS_EXPIRES_IN: 15m
  #     JWT_REFRESH_EXPIRES_IN: 7d
  #     CORS_ORIGIN: http://localhost:3000
  #     NODE_ENV: development
  #     UPLOAD_DIR: /app/uploads
  #     MAX_FILE_SIZE: 5242880
  #     RATE_LIMIT_WINDOW_MS: 900000
  #     RATE_LIMIT_MAX_REQUESTS: 100
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   volumes:
  #     - upload_data:/app/uploads
  #   networks:
  #     - hmcs-network

  # Scheduler (runs penalty checks) — Reference only
  # scheduler:
  #   build:
  #     context: .
  #     dockerfile: DOCKERFILE.server
  #   container_name: hmcs-scheduler
  #   command: ["node", "dist/scheduler.js"]
  #   environment:
  #     DATABASE_URL: postgresql://hmcs:hmcs_dev_password@postgres:5432/hmcs
  #     SCHEDULER_INTERVAL_MS: 60000
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
